<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据库文档</title>
<style>
:root{--ink:#142238;--muted:#607086;--quiet:#91a0b0;--line:#dde5ee;--line-strong:#c8d4df;--wash:#f4f7fb;--paper:#fff;--nav:#15263d;--nav-soft:#213b5b;--blue:#2563eb;--blue-soft:#eff6ff;--teal:#0f766e;--teal-soft:#ecfdf5;--shadow:0 16px 44px rgba(36,58,85,.08)}*{box-sizing:border-box}html{min-width:320px}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}.layout{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--nav);color:#fff;padding:24px 18px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}.brand-mark{width:35px;height:35px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:var(--nav-soft);flex:0 0 auto}.brand-mark svg{width:19px;height:19px}.brand h1{margin:0;font-size:17px;line-height:1.2}.brand p{margin:4px 0 0;color:#9fb4c9;font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.meta{display:flex;align-items:center;gap:7px;color:#c5d2df;margin:0 0 18px;font-size:12px}.meta-dot{width:6px;height:6px;border-radius:50%;background:#5eead4;box-shadow:0 0 0 3px rgba(94,234,212,.12)}.search-wrap{position:relative;margin-bottom:20px}.search-wrap svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:#88a0b7;pointer-events:none}.search-wrap input{width:100%;height:42px;border:1px solid #3d5671;border-radius:8px;background:#1b314d;color:#fff;padding:9px 11px 9px 35px;font:inherit;outline:0;transition:border-color .18s,box-shadow .18s}.search-wrap input::placeholder{color:#8fa4b8}.search-wrap input:focus{border-color:#80aafc;box-shadow:0 0 0 4px rgba(96,165,250,.17)}.nav-label{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#87a0b8;font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;margin:0 8px 8px}.nav-count{color:#b8c9da}.nav{display:grid;gap:14px}.nav-group{min-width:0}.nav-group-title{display:flex;align-items:center;gap:7px;color:#b9c9d9;font-size:11px;font-weight:700;padding:0 8px 5px;overflow-wrap:anywhere}.nav-group-title svg{width:13px;height:13px;color:#7e9ab4;flex:0 0 auto}.nav-link{display:flex;align-items:center;min-height:34px;color:#dbe6f0;text-decoration:none;padding:7px 9px 7px 28px;border-left:2px solid transparent;border-radius:6px;overflow-wrap:anywhere;transition:background .18s,color .18s,border-color .18s}.nav-link:hover{background:#203b59;color:#fff}.nav-link:focus-visible{outline:2px solid #8bb4ff;outline-offset:2px}.nav-link.active{background:#204e89;color:#fff;border-left-color:#8bb4ff}.nav-empty{margin:0 8px;color:#8fa4b8;font-size:12px}.main{min-width:0;padding:32px clamp(22px,4vw,60px);max-width:1220px}.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:26px}.kicker{color:var(--blue);font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em}.view-head h2{font-size:27px;line-height:1.2;margin:8px 0 7px;letter-spacing:-.02em}.intro{margin:0;color:var(--muted);max-width:680px}.header-stat{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--paper);border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:12px;white-space:nowrap;box-shadow:0 5px 18px rgba(36,58,85,.04)}.header-stat strong{color:var(--ink);font-size:15px}.table-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.table-card{position:relative;display:block;min-height:112px;border:1px solid var(--line);border-radius:10px;padding:16px 17px 15px;text-decoration:none;color:var(--ink);background:var(--paper);box-shadow:0 4px 18px rgba(36,58,85,.035);transition:border-color .18s,box-shadow .18s,transform .18s}.table-card:hover{border-color:#9bbbf1;box-shadow:0 10px 24px rgba(37,99,235,.1);transform:translateY(-1px)}.table-card:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.table-card strong{display:block;font-size:15px;overflow-wrap:anywhere;padding-right:20px}.table-card span{display:block;color:var(--muted);font-size:12px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table-card .card-arrow{position:absolute;right:15px;top:16px;color:#9db0c3}.table-card .card-arrow svg{width:16px;height:16px}.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:28px 18px;color:var(--muted);background:rgba(255,255,255,.6)}.loading{display:flex;align-items:center;gap:9px;color:var(--muted);padding:20px 0}.spinner{width:15px;height:15px;border:2px solid #c9d8ec;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.back{display:inline-flex;align-items:center;gap:6px;color:var(--blue);text-decoration:none;font-weight:650;margin-bottom:18px}.back:hover{text-decoration:underline}.back svg{width:16px;height:16px}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.detail-head h2{font-size:27px;margin:0 0 6px;overflow-wrap:anywhere}.detail-sub{margin:0;color:var(--muted)}.detail-pill{border:1px solid #b5e6dc;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:6px 10px;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.table-frame{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:var(--shadow)}table{border-collapse:collapse;width:100%;min-width:860px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px 13px;vertical-align:top}th{background:#f7f9fc;color:#53657a;font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}tbody tr:hover{background:#fbfdff}tr:last-child td{border-bottom:0}td:first-child{color:#1e4fae;font-weight:700}.tag{display:inline-flex;align-items:center;border:1px solid #a8dcd2;background:var(--teal-soft);color:var(--teal);padding:2px 6px;border-radius:4px;margin-right:5px;font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.detail-card{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:15px 16px}.detail-card h3{display:flex;align-items:center;gap:7px;font-size:13px;margin:0 0 10px}.detail-card h3 svg{width:15px;height:15px;color:var(--blue)}.detail-card p{margin:4px 0;color:var(--muted);overflow-wrap:anywhere}.detail-card .empty-line{color:var(--quiet)}.hidden{display:none!important}@media(max-width:760px){.layout{display:block}.sidebar{position:relative;height:auto;padding:18px 16px}.brand{margin-bottom:16px}.nav{max-height:230px;overflow:auto}.main{padding:24px 16px}.view-head,.detail-head{display:block}.header-stat,.detail-pill{display:inline-flex;margin-top:14px}.view-head h2,.detail-head h2{font-size:23px}.details{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="7" ry="3"></ellipse><path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5"></path><path d="M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"></path></svg></div><div><h1>数据库文档</h1><p>SCHEMA REFERENCE</p></div></div><div id="meta" class="meta"><span class="meta-dot"></span><span>正在读取文档信息</span></div><div class="search-wrap"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="search" type="search" placeholder="搜索表或字段" autocomplete="off"></div><div class="nav-label"><span>TABLES</span><span id="nav-count" class="nav-count"></span></div><nav id="nav" class="nav"></nav></aside><main class="main"><section id="directory"><div class="view-head"><div><div class="kicker">DATABASE CATALOG</div><h2>数据库表目录</h2><p id="intro" class="intro"></p></div><div id="header-stat" class="header-stat"><strong>0</strong><span>张表</span></div></div><div id="content"></div></section><section id="detail" hidden></section></main></div>
<script type="application/json" id="schema-data">__SCHEMA_JSON__</script><script type="application/json" id="search-data">__SEARCH_INDEX_JSON__</script>
<script>
const schema=JSON.parse(document.getElementById('schema-data').textContent),searchIndex=JSON.parse(document.getElementById('search-data').textContent),refs=schema.namespaces.flatMap(ns=>ns.tables),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),list=(value,mapper=x=>esc(x))=>(value||[]).map(mapper).join(', ')||'<span class="empty-line">-</span>',byDetail=new Map(refs.map(ref=>[ref.detail,ref]));
document.title=`${schema.database||schema.engine} - 数据库文档`;document.getElementById('meta').innerHTML=`<span class="meta-dot"></span><span>${esc(schema.engine)} · ${esc(schema.database||'database')}</span>`;document.getElementById('intro').textContent=`浏览表、字段、约束和索引说明。支持按表名、表说明或字段搜索。`;
const nav=document.getElementById('nav'),content=document.getElementById('content'),directory=document.getElementById('directory'),detailPanel=document.getElementById('detail'),navCount=document.getElementById('nav-count'),headerStat=document.getElementById('header-stat');let activePath=null;
function hashFor(path){return `#table=${encodeURIComponent(path)}`}function currentPath(){return location.hash.startsWith('#table=')?decodeURIComponent(location.hash.slice(7)):null}
function openTable(path,write=true){const ref=byDetail.get(path);if(!ref)return;if(write)history.pushState({table:path},'',hashFor(path));activePath=path;directory.hidden=true;detailPanel.hidden=false;detailPanel.innerHTML='<div class="loading"><span class="spinner"></span><span>正在加载表详情...</span></div>';fetch(ref.detail).then(response=>{if(!response.ok)throw new Error(`加载失败 (${response.status})`);return response.json()}).then(renderDetail).catch(error=>{detailPanel.innerHTML=`<a class="back" href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>返回表目录</a><p class="empty">${esc(error.message)}。请通过 scripts/serve.py 启动本地文档查看器后重试。</p>`;detailPanel.querySelector('.back').addEventListener('click',event=>{event.preventDefault();showDirectory()})})}
function renderDetail(data){const table=data.table,group=(title,icon,items,mapper)=>`<section class="detail-card"><h3>${icon}${title}</h3>${items.length?items.map(mapper).join(''):'<p class="empty-line">-</p>'}</section>`;detailPanel.innerHTML=`<a class="back" href="#"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>返回表目录</a><div class="detail-head"><div><h2>${esc(table.name)}</h2><p class="detail-sub">${esc([data.catalog,data.schema].filter(Boolean).join(' / '))}${data.catalog||data.schema?' · ':''}${esc(table.comment)||'暂无表说明'}</p></div><span class="detail-pill">TABLE METADATA</span></div><div class="table-frame"><table><thead><tr><th>字段</th><th>类型</th><th>可空</th><th>默认值</th><th>长度</th><th>精度 / 小数位</th><th>说明</th></tr></thead><tbody>${table.columns.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.type)||'-'}</td><td>${c.nullable?'是':'否'}</td><td>${esc(c.default)||'-'}</td><td>${esc(c.length)||'-'}</td><td>${[c.precision,c.scale].filter(v=>v!=null).join(' / ')||'-'}</td><td>${c.identity?'<span class="tag">identity</span>':''}${esc(c.comment)||'-'}</td></tr>`).join('')}</tbody></table></div><div class="details">${group('主键','<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-9.6 9.6"></path><path d="M15.5 2H21v5.5"></path><path d="M13 10 3 20l1 1 3-3 2 1 2-2-1-2 3-3"></path></svg>',[{columns:table.primary_key}],x=>`<p>${list(x.columns)}</p>`)}${group('唯一约束','<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>',table.unique_constraints,x=>`<p><strong>${esc(x.name)}</strong>: ${list(x.columns)}</p>`)}${group('外键','<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"></path><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"></path></svg>',table.foreign_keys,x=>`<p><strong>${esc(x.name)}</strong>: ${list(x.columns)} → ${esc(x.ref_schema?x.ref_schema+' / ':'')}${esc(x.ref_table)} (${list(x.ref_columns)})</p>`)}${group('索引','<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"></path><path d="M4 19h16"></path><path d="m7 15 3-3 3 2 5-6"></path></svg>',table.indexes,x=>`<p><strong>${esc(x.name)}</strong>: ${list(x.columns)}${x.unique?' · unique':''}${x.method?' · '+esc(x.method):''}</p>`)}</div>`;detailPanel.querySelector('.back').addEventListener('click',event=>{event.preventDefault();history.pushState({},'',location.pathname+location.search);showDirectory()})}
function showDirectory(){activePath=null;detailPanel.hidden=true;directory.hidden=false;const items=filterItems();renderNav(items);renderCards(items)}function attach(link,path){link.href=hashFor(path);link.addEventListener('click',event=>{event.preventDefault();openTable(path)})}
function renderNav(items){nav.replaceChildren();navCount.textContent=`${items.length} / ${searchIndex.length}`;if(!items.length){const empty=document.createElement('p');empty.className='nav-empty';empty.textContent='没有匹配项';nav.append(empty);return}const groups=new Map();for(const item of items){const key=[item.catalog,item.schema].filter(Boolean).join(' / ')||'main';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item)}for(const [name,groupItems] of groups){const group=document.createElement('div');group.className='nav-group';const heading=document.createElement('div');heading.className='nav-group-title';heading.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h5l2 2h11v10H3z"></path><path d="M3 7V5h6l2 2"></path></svg>';const label=document.createElement('span');label.textContent=name;heading.append(label);group.append(heading);for(const item of groupItems){const link=document.createElement('a');link.className=`nav-link${item.detail===activePath?' active':''}`;link.textContent=item.name;attach(link,item.detail);group.append(link)}nav.append(group)}}
function renderCards(items){content.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有匹配的表或字段。请尝试其他关键词。';content.append(empty);headerStat.innerHTML='<strong>0</strong><span>张表</span>';return}const listNode=document.createElement('div');listNode.className='table-list';for(const item of items){const card=document.createElement('a');card.className='table-card';card.innerHTML=`<strong>${esc(item.name)}</strong><span>${esc([item.schema,item.comment].filter(Boolean).join(' · ')||'暂无表说明')}</span><span class="card-arrow"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span>`;attach(card,item.detail);listNode.append(card)}content.append(listNode);headerStat.innerHTML=`<strong>${items.length}</strong><span>张表</span>`}
function haystack(item){return [item.name,item.comment,item.schema,...item.columns.flatMap(c=>[c.name,c.comment])].filter(Boolean).join(' ').toLowerCase()}function filterItems(){const term=document.getElementById('search').value.trim().toLowerCase();return searchIndex.filter(item=>!term||haystack(item).includes(term))}
document.getElementById('search').addEventListener('input',()=>showDirectory());window.addEventListener('popstate',()=>{const path=currentPath();path?openTable(path,false):showDirectory()});window.addEventListener('hashchange',()=>{const path=currentPath();if(path&&path!==activePath)openTable(path,false)});showDirectory();const initial=currentPath();if(initial)openTable(initial,false);
</script></body></html>
