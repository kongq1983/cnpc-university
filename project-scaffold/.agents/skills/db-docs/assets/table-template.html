<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表详情</title>
<style>
:root{--ink:#17212b;--muted:#68747f;--line:#dce1e5;--wash:#f5f7f8;--nav:#17324d}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}header{background:var(--nav);color:#fff;border-bottom:4px solid #e9b949}header div,main{max-width:1180px;margin:auto;padding:20px 24px}header a{color:#fff;text-decoration:none}h1{font-size:21px;margin:0 0 5px}header p{margin:0;color:#c8d5df}main{padding-top:30px}.comment{color:var(--muted);margin:0 0 18px}.scroll{overflow-x:auto;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:860px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}th{background:var(--wash);font-size:12px;text-transform:uppercase;color:#42515e}tr:last-child td{border-bottom:0}.tag{display:inline-block;border:1px solid #9bcdbd;color:#07624a;padding:1px 6px;border-radius:3px;margin-right:4px;font-size:12px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.detail{border-left:3px solid var(--line);padding-left:10px}.detail h2{font-size:14px;margin:0 0 6px}.detail p{margin:2px 0;color:#43515d}.empty{color:var(--muted)}@media(max-width:760px){header div,main{padding-left:16px;padding-right:16px}.details{grid-template-columns:1fr}}
</style>
</head>
<body><header><div><a href="../../../index.html">返回数据库文档</a><h1 id="title"></h1><p id="meta"></p></div></header><main><p id="comment" class="comment"></p><div class="scroll"><table><thead><tr><th>字段</th><th>类型</th><th>可空</th><th>默认值</th><th>长度</th><th>精度/小数位</th><th>说明</th></tr></thead><tbody id="columns"></tbody></table></div><div class="details"><section class="detail"><h2>主键</h2><p id="primary"></p></section><section class="detail"><h2>唯一约束</h2><div id="unique"></div></section><section class="detail"><h2>外键</h2><div id="foreign"></div></section><section class="detail"><h2>索引</h2><div id="indexes"></div></section></div></main>
<script type="application/json" id="table-data">__TABLE_JSON__</script>
<script>
const data=JSON.parse(document.getElementById('table-data').textContent),table=data.table,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),list=(value,mapper=x=>esc(x))=>(value||[]).map(mapper).join(', ')||'<span class="empty">-</span>',detail=(container,items,mapper)=>{container.innerHTML=items.length?items.map(mapper).join(''):'<p class="empty">-</p>'};
document.title=`${table.name} - 数据库文档`;document.getElementById('title').textContent=table.name;document.getElementById('meta').textContent=[data.catalog,data.schema].filter(Boolean).join(' / ')||data.engine;document.getElementById('comment').textContent=table.comment||'无表说明';document.getElementById('columns').innerHTML=table.columns.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.type)||'-'}</td><td>${c.nullable?'是':'否'}</td><td>${esc(c.default)||'-'}</td><td>${esc(c.length)||'-'}</td><td>${[c.precision,c.scale].filter(v=>v!=null).join(' / ')||'-'}</td><td>${c.identity?'<span class="tag">identity</span>':''}${esc(c.comment)||'-'}</td></tr>`).join('');document.getElementById('primary').innerHTML=list(table.primary_key);detail(document.getElementById('unique'),table.unique_constraints,x=>`<p>${esc(x.name)}: ${list(x.columns)}</p>`);detail(document.getElementById('foreign'),table.foreign_keys,x=>`<p>${esc(x.name)}: ${list(x.columns)} → ${esc(x.ref_schema?x.ref_schema+' / ':'')}${esc(x.ref_table)} (${list(x.ref_columns)})</p>`);detail(document.getElementById('indexes'),table.indexes,x=>`<p>${esc(x.name)}: ${list(x.columns)}${x.unique?' · unique':''}${x.method?' · '+esc(x.method):''}</p>`);
</script></body></html>
